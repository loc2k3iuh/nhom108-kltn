spring.application.name=kltn-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_NAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=9999
server.servlet.context-path=/luther

aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=ap-southeast-1
aws.s3.bucket.name=loc2k3iuh

api.prefix=/api/v1

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.token.expiration-in-s=${JWT_TOKEN_EXPIRATION_IN_S}
jwt.refresh-token.expiration-in-s=${JWT_REFRESH_TOKEN_EXPIRATION_IN_S}
jwt.signer.key=${JWT_SIGNER_KEY}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.ssl.enabled=true


vite.front-end.admin.url=${VITE_FRONT_END_ADMIN_DEVELOPMENT_URL}
vite.front-end.client.url=${VITE_FRONT_END_CLIENT_DEVELOPMENT_URL}
vite.frontend.urls=${VITE_FRONT_END_ADMIN_DEVELOPMENT_URL},${VITE_FRONT_END_CLIENT_DEVELOPMENT_URL}

vn-pay.url=${VN_PAY_URL}
vn-pay.return-url=${VN_PAY_RETURN_URL}
vn-pay.api-url=${VN_PAY_API_URL}
vn-pay.tmn-code=${VN_PAY_TMN_CODE}
vn-pay.secret-key=${VN_PAY_SECRET_KEY}



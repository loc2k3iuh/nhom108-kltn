<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 8px; text-align: center; }
        .otp { font-size: 28px; font-weight: bold; color: #2d89ef; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔐 Your OTP Code</h2>
    <p th:text="'Hello ' + ${username}"></p>
    <p>Please use the following OTP to complete your login:</p>
    <p class="otp" th:text="${otp}"></p>
    <p>This code will expire in 5 minutes.</p>
</div>
</body>
</html>
